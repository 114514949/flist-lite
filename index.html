<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flist-lite</title>
    <meta name="description" content="点击文件即可查看该文件的独立介绍与下载地址。" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <script src="assets/theme.js"></script>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#file-list">跳到文件列表</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="#/">
          <span class="brand-logo" id="site-logo">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 10.6A2.6 2.6 0 0 1 6.6 8h5.1c.72 0 1.4.35 1.82.94l.62.88c.42.6 1.1.94 1.82.94H25.4A2.6 2.6 0 0 1 28 13.36v8.94A2.6 2.6 0 0 1 25.4 24.9H6.6A2.6 2.6 0 0 1 4 22.3z" />
            </svg>
          </span>
          <span class="brand-name" id="site-name">文件列表</span>
        </a>

        <div class="header-actions">
          <nav class="header-links" id="header-links" aria-label="站点链接"></nav>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="切换主题">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2" />
              <path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <nav class="breadcrumb" id="breadcrumb" aria-label="当前位置"></nav>

      <section class="list-card">
        <div class="list-head">
          <h1 class="list-title">文件列表</h1>
          <span class="list-hint">点击文件查看介绍与下载地址</span>
        </div>

        <div class="list-toolbar" id="list-toolbar" hidden>
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="6.4" />
              <path d="m15.8 15.8 4.2 4.2" />
            </svg>
            <input id="search" type="search" placeholder="搜索当前目录（按 / 聚焦）" autocomplete="off" spellcheck="false" />
          </label>
          <span class="list-count" id="list-count"></span>
          <div class="sort-tabs" role="group" aria-label="排序方式">
            <button type="button" data-sort="name">名称</button>
            <button type="button" data-sort="size">大小</button>
            <button type="button" data-sort="date">更新时间</button>
          </div>
        </div>

        <div class="file-list" id="file-list"></div>
      </section>

      <section class="panel panel-announce" id="panel" hidden aria-live="polite"></section>
    </main>

    <footer class="site-footer">
      <div class="container" id="site-footer"></div>
    </footer>

    <script type="module" src="assets/app.js"></script>
  </body>
</html>
